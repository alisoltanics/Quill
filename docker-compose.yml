services:
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  gateway:
    build: ./services/gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - DOCUMENT_SERVICE_URL=http://document-service:8000
      - OBSERVABILITY_ENABLED=${OBSERVABILITY_ENABLED:-false}
      - OTEL_SERVICE_NAME=realtime-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - redis
      - jaeger

  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./services/frontend:/app:cached
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - gateway
  document-service:
    build: ./services/document_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_ADDR=redis:6379
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=docdb
      - POSTGRES_USER=docuser
      - POSTGRES_PASSWORD=docpass
      - OBSERVABILITY_ENABLED=${OBSERVABILITY_ENABLED:-false}
      - OTEL_SERVICE_NAME=document-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - redis
      - postgres
      - jaeger
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=docdb
      - POSTGRES_USER=docuser
      - POSTGRES_PASSWORD=docpass
    ports:
      - "5432:5432"

  fastapi-service:
    build: ./services/fastapi_service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: realtime-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: realtime-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - gateway
      - document-service
      - redis-exporter
      - postgres-exporter
      - node-exporter

  grafana:
    image: grafana/grafana:11.1.0
    container_name: realtime-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  redis-exporter:
    image: oliver006/redis_exporter:v1.63.0
    container_name: realtime-redis-exporter
    restart: unless-stopped
    command:
      - --redis.addr=redis:6379
    depends_on:
      - redis
    ports:
      - "9121:9121"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: realtime-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: realtime-postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://docuser:docpass@postgres:5432/docdb?sslmode=disable
    depends_on:
      - postgres
    ports:
      - "9187:9187"

volumes:
  prometheus_data:
  grafana_data:
